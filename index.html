<script>
const BUILTIN={"yrs":[2026,2027,2028,2029,2030,2031,2032,2033,2034,2035],"nat":[["01-01","Año Nuevo"],["01-06","Reyes"],["03-19","San José"],["E-2","Viernes Santo"],["E+1","Lunes de Pascua"],["05-01","Día del Trabajo"],["10-09","Día de la Comunitat Valenciana"],["10-12","Fiesta Nacional de España"],["11-01","Todos los Santos"],["12-06","Día de la Constitución"],["12-08","Inmaculada Concepción"],["12-24","Nochebuena (especial)"],["12-25","Navidad"],["12-31","Nochevieja (especial)"]],"loc":{"Albatera":[["E+8","San Vicente"],["07-25","Santiago Apóstol"]],"Algorfa":[["E+8","San Vicente Ferrer"],["07-16","Virgen del Carmen"]],"Almoradí":[["07-30","Santicos de la Piedra"],["11-30","San Andrés"]],"Benejúzar":[["E+60","Corpus Christi"],["10-07","Virgen del Rosario"]],"Benferri":[["09-30","San Jerónimo"],["10-07","Virgen del Rosario"]],"Bigastro":[["E-3","Jueves Santo"],["E+8","San Vicente Ferrer"]],"Callosa de Segura":[["E-3","Jueves Santo"],["E+8","San Vicente"]],"Catral":[["02-05","Fiesta local"],["02-06","Fiesta local"]],"Cox":[["05-15","San Isidro"],["07-16","Virgen del Carmen"]],"Daya Nueva":[["09-29","San Miguel"],["09-30","Día de La Morera"]],"Daya Vieja":[["E+8","San Vicente"],["09-08","Virgen de Monserrate"]],"Dolores":[["E-9","Viernes de Dolor"],["09-21","Ntra. Sra. de los Dolores"]],"Granja de Rocamora":[["06-29","San Pedro"],["10-07","Virgen del Rosario"]],"Jacarilla":[["E+8","San Vicente"],["09-08","Virgen de Belén"]],"Orihuela":[["07-17","Gloriosa Enseña del Oriol"],["09-08","Virgen de Monserrate"]],"Rafal":[["10-07","Fiesta local"],["10-08","Fiesta local"]],"Redován":[["09-08","Fiesta local"],["09-29","Fiesta local"]],"San Isidro":[["05-15","San Isidro Labrador"],["12-07","San Ambrosio"]],"Benijófar":[["E+8","2º lunes de Pascua"],["07-25","San Jaime"]],"Formentera del Segura":[["08-24","Fiesta local"],["09-29","Fiesta local"]],"Guardamar del Segura":[["07-24","Víspera de Santiago Apóstol"],["10-07","Virgen del Rosario"]],"Los Montesinos":[["07-30","Segregación del Ayuntamiento"],["10-13","Fiesta local"]],"Orihuela Costa":[["07-17","Gloriosa Enseña del Oriol"],["09-08","Virgen de Monserrate"]],"Pilar de la Horadada":[["07-30","Aniversario de la Segregación"],["10-13","Día posterior a la Virgen del Pilar"]],"Rojales":[["06-29","San Pedro Apóstol"],["10-07","Virgen del Rosario"]],"San Fulgencio":[["01-16","Patrón San Fulgencio"],["10-08","Virgen del Remedio"]],"San Miguel de Salinas":[["09-28","Fiesta local"],["09-29","Fiesta local"]],"Torrevieja":[["E+8","San Vicente Ferrer"],["07-16","Virgen del Carmen"]]}},CODE='IntersindicalSalut';
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),K=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const CODES={M:['Mañana',8,15,'#d99a2b'],T:['Tarde',15,22,'#d9692b'],D:['Día 12 h',8,20,'#3a7ca5'],N:['Noche 12 h',20,8,'#5b3f8c'],n:['Noche 10 h',22,8,'#7a5aa6'],L:['Libre',0,0,'#a79d99']};
const PRE={'Fijo de mañana (L-V)':'M M M M M L L','Fijo de tarde (L-V)':'T T T T T L L','12 h, 3 libranzas':'D N L L L','12 h, 4 libranzas':'D N L L L L','Mañana-tarde (semanas alternas)':'M M M M M L L T T T T T L L','Mañana-tarde-noche':'M M T T n n L L'};
const INC={V:'Vacaciones',LD:'Libre disposición',LA:'Libre disp. adicional',AB:'Otro absentismo'},MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const ld=(k,d)=>{try{return JSON.parse(localStorage[k])}catch(e){return d}};
let S={name:'',muni:'',svc:'',pat:PRE['12 h, 3 libranzas'],ps:'',base:22,ov:{},inc:{},nt:{},av:[],...ld('cal27',{})};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');const save=()=>localStorage.cal27=JSON.stringify(S);
let CFG=ld('cfg',null);if(!CFG||!CFG.nat){CFG=BUILTIN;localStorage.removeItem('cfg')}let Y=2027,Mo=0,tab='cal',GM=Object.keys(BUILTIN.loc)[0];
fetch('festivos.json').then(r=>r.ok?r.json():0).then(j=>{if(j&&j.nat&&!localStorage.cfg){CFG=j;draw()}}).catch(()=>{});
function hrs(c){const k=CODES[c];if(!k||c=='L')return[0,0];let s=k[1],e=k[2];if(e<=s)e+=24;let n=0;for(let h=s;h<e;h++){const x=h%24;if(x>=22||x<8)n++}return[e-s,e-s+n*.25]}
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=(h+l-7*m+114)%31+1;return new Date(y,mo-1,da)}
function rule(y,r){if(r[0]=='E'){const d=easter(y);d.setDate(d.getDate()+ +r.slice(1));return d}const[m,d]=r.split('-');return new Date(y,m-1,d)}
function hol(y){const c=CFG,o={};c.nat.forEach(([r,n])=>o[K(rule(y,r))]=[n,'N']);(c.loc[S.muni]||[]).forEach(([r,n])=>o[K(rule(y,r))]=[n,'L']);return o}
function sh(d){const k=K(d);if(S.ov[k])return S.ov[k];if(!S.ps)return'';const p=S.pat.trim().split(/\s+/).filter(x=>CODES[x]);if(!p.length)return'';const n=Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.parse(S.ps))/864e5);return p[((n%p.length)+p.length)%p.length]}
function stats(y,m){let w=0,c=0,n=0,ab={};for(let d=new Date(y,m??0,1);d.getFullYear()==y&&(m==null||d.getMonth()==m);d.setDate(d.getDate()+1)){const k=K(d);if(S.inc[k]){ab[S.inc[k]]=(ab[S.inc[k]]||0)+1;continue}const[a,b]=hrs(sh(d));if(a){w+=a;c+=b;n++}}return{w,c,n,ab}}
const f2=x=>(Math.round(x*100)/100).toString().replace('.',',');
function ent(y){if(!S.svc)return null;const sy=+S.svc.slice(0,4),yrs=y-sy,dy=(Date.UTC(y+1,0,1)-Date.UTC(y,0,1))/864e5,served=Math.min(dy,(Date.UTC(y+1,0,1)-Date.parse(S.svc))/864e5);if(yrs<0)return null;const ad=yrs>=30?4:yrs>=25?3:yrs>=20?2:yrs>=15?1:0,t=Math.floor(yrs/3);return{yrs,ad,vac:S.base+ad,ld:6*Math.max(0,served)/dy,la:t>=6?2+Math.max(0,t-7):0,t}}
function used(y){const u={V:0,LD:0,LA:0,AB:0};for(const k in S.inc)if(k.startsWith(y))u[S.inc[k]]++;return u}
const chip=c=>c?`<span class="c" style="background:${CODES[c][3]}">${c}</span>`:'';
const TABS=[['cal','Calendario'],['turno','Mi turno'],['dias','Mis días'],['res','Resumen y PDF'],['av','Avisos']];
function draw(){const g=location.hash=='#gestion',T=g?[...TABS,['gest','Gestión']]:TABS;$('#nv').innerHTML=T.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="tab='${t[0]}';draw()">${t[1]}</button>`).join('');$('#v').innerHTML=V[tab]();}
const yearSel=()=>`<select style="width:auto" onchange="Y=+this.value;draw()">${CFG.yrs.map(y=>`<option ${y==Y?'selected':''}>${y}</option>`).join('')}</select>`;
const V={
cal(){const H=hol(Y),first=new Date(Y,Mo,1),off=(first.getDay()+6)%7,nd=new Date(Y,Mo+1,0).getDate();let h=`<div class="bar"><button class="s" onclick="Mo=(Mo+11)%12;draw()">‹</button><h3>${MES[Mo]} ${yearSel()}</h3><button class="s" onclick="Mo=(Mo+1)%12;draw()">›</button></div>`;if(!S.muni)h+='<p class="note">Elige tu municipio en «Mi turno» para ver los festivos locales.</p>';h+='<div class="g">'+'LMXJVSD'.split('').map(x=>`<div class="h">${x}</div>`).join('')+'<div class="x"></div>'.repeat(off);for(let i=1;i<=nd;i++){const d=new Date(Y,Mo,i),k=K(d),x=H[k],c=sh(d);h+=`<div class="${x?'f':''}" onclick="dayDlg('${k}')">${i}<br>${chip(c)}${S.inc[k]?`<i>${S.inc[k]}</i>`:''}${x?`<small>${x[0]}</small>`:''}${S.nt[k]?`<small style="color:#555">✎ ${esc(S.nt[k].slice(0,16))}</small>`:''}</div>`}h+='</div><p class="note">Toca un día para cambiar el turno o marcar una incidencia. Los días en rojo son festivos.</p>';const s=stats(Y,Mo);return h+`<div class="card">${MES[Mo]}: <b>${s.n}</b> jornadas · <b>${f2(s.w)} h</b> trabajadas · <b>${f2(s.c)} h</b> computadas</div>`},
turno(){return`<h3>Mi turno</h3><label>Municipio del centro de trabajo</label><select onchange="S.muni=this.value;save()"><option value="">— elige —</option>${Object.keys(CFG.loc).sort().map(m=>`<option ${m==S.muni?'selected':''}>${m}</option>`).join('')}</select>
<label>Plantilla</label><select onchange="if(this.value){S.pat=this.value;save();draw()}"><option value="">— elige una —</option>${Object.entries(PRE).map(([n,p])=>`<option value="${p}">${n}</option>`).join('')}</select>
<label>Patrón (códigos separados por espacio)</label><input value="${S.pat}" onchange="S.pat=this.value;save()"><p class="note">${Object.entries(CODES).map(([c,k])=>`${chip(c)} ${k[0]}${c=='L'?'':` ${k[1]}-${k[2]} h`}`).join(' · ')}</p>
<label>Fecha en que empieza el ciclo</label><input type="date" value="${S.ps}" onchange="S.ps=this.value;save()"><p><button onclick="draw();tab='cal';draw()">Ver calendario</button></p>
<hr><label>Cargar configuración (festivos.json)</label><input type="file" accept=".json" onchange="imp(this)"></p><p class="note">Las horas nocturnas (22:00-08:00) computan a 1,25.</p>`},
dias(){const e=ent(Y),u=used(Y),row=(n,d,x)=>`<tr><td>${n}</td><td class="n">${f2(d)}</td><td class="n">${x}</td><td class="n"><b>${f2(d-x)}</b></td></tr>`;return`<h3>Mis días ${yearSel()}</h3><label>Fecha de inicio de servicios</label><input type="date" value="${S.svc}" onchange="S.svc=this.value;save();draw()"><label>Vacaciones base (días)</label><input type="number" value="${S.base}" onchange="S.base=+this.value;save();draw()">`+(e?`<div class="card"><table><tr><th></th><th class="n">Derecho</th><th class="n">Usados</th><th class="n">Quedan</th></tr>${row('Vacaciones (base + '+e.ad+' adic.)',e.vac,u.V)}${row('Libre disposición',e.ld,u.LD)}${row('Libre disp. adicional',e.la,u.LA)}</table></div><p class="note">Años de servicio a 31/12: ${e.yrs} · trienios: ${e.t}. Libre disposición: ${f2(e.ld*7)} h (jornadas de 7 h), hasta el 15 de enero siguiente; prorrateo exacto el año de ingreso.</p>`:'<p class="note">Indica tu fecha de inicio de servicios para calcular tus días.</p>')},
res(){const mm=stats(Y,Mo),ya=stats(Y);return`<h3>Resumen ${yearSel()}</h3><div class="card"><b>${MES[Mo]}</b>: ${mm.n} jornadas · ${f2(mm.w)} h trabajadas · ${f2(mm.c)} h computadas</div><div class="card"><b>Año ${Y}</b>: ${ya.n} jornadas · ${f2(ya.w)} h trabajadas · ${f2(ya.c)} h computadas${Object.entries(ya.ab).map(([k,v])=>`<br>${INC[k]}: ${v} días`).join('')}</div><div class="row"><button onclick="pdf(${Mo})">PDF de ${MES[Mo]}</button><button onclick="pdf()">PDF anual</button></div><p class="note">Cambia de mes en la pestaña Calendario. Copia de seguridad:</p><div class="row"><button class="s" onclick="bk()">Descargar copia</button><input type="file" accept=".json" onchange="rs(this)"></div>`},
av(){return`<h3>Avisos</h3><div class="row"><input type="date" id="ad"><input id="at" placeholder="Texto del aviso"></div><p><button onclick="addAv()">Añadir</button> <button class="s" onclick="ics()">Exportar .ics</button></p>${S.av.map((a,i)=>`<div class="card">${a.d} · ${a.t} <button class="s" onclick="S.av.splice(${i},1);save();draw()">×</button></div>`).join('')||'<p class="note">Sin avisos.</p>'}<p class="note">El archivo .ics crea eventos con alarma a las 9:00 en el calendario del móvil.</p>`},
gest(){const L=(CFG.loc[GM]||[]).map(([r,n])=>`${r[0]=='E'?r:r.slice(3)+'/'+r.slice(0,2)} ${n}`).join('\n');return`<h3>Gestión de festivos (valen para todos los años)</h3><label>Municipio</label><select onchange="GM=this.value;draw()">${Object.keys(CFG.loc).sort().map(m=>`<option ${m==GM?'selected':''}>${m}</option>`).join('')}</select><label>Festivos locales (uno por línea: dd/mm Nombre · o E+8 Nombre = Pascua +8 días)</label><textarea id="gt" rows="6">${L}</textarea><div class="row" style="margin-top:8px"><button onclick="gsave()">Guardar municipio</button><button class="s" onclick="gdl()">Descargar festivos.json</button></div><p class="note">Sube festivos.json al repositorio para actualizar a todos, o envíalo a un afiliado para que lo cargue en «Mi turno».</p>`}};
function gsave(){CFG.loc[GM]=$('#gt').value.split('\n').map(l=>{let m=l.match(/^(\d\d)\/(\d\d)\s+(.*)/);if(m)return[`${m[2]}-${m[1]}`,m[3]];m=l.match(/^(E[+-]\d+)\s+(.*)/);return m?[m[1],m[2]]:0}).filter(Boolean);localStorage.cfg=JSON.stringify(CFG);draw()}
function dl(n,t,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:mime||'application/json'}));a.download=n;a.click()}
const gdl=()=>dl('festivos.json',JSON.stringify(CFG,null,1)),bk=()=>dl('copia_calendario.json',JSON.stringify(S));
function rd(i,f){const r=new FileReader();r.onload=()=>{try{f(JSON.parse(r.result))}catch(e){alert('Archivo no válido')}};r.readAsText(i.files[0])}

function dayDlg(k){const d=$('#dg');d.innerHTML=`<b>${k.split('-').reverse().join('/')}</b><p>Nota (texto libre):</p><textarea rows="3" oninput="setNt('${k}',this.value)">${esc(S.nt[k]||'')}</textarea><p>Turno:</p>${Object.keys(CODES).map(c=>`<button onclick="setOv('${k}','${c}')">${c} ${CODES[c][0]}</button>`).join('')}<button class="s" onclick="setOv('${k}','')">Automático</button><p>Incidencia:</p>${Object.entries(INC).map(([c,n])=>`<button onclick="setInc('${k}','${c}')">${n}</button>`).join('')}<button class="s" onclick="setInc('${k}','')">Ninguna</button><p><button class="s" onclick="$('#dg').close()">Cerrar</button></p>`;d.showModal()}
const setNt=(k,v)=>{v.trim()?S.nt[k]=v:delete S.nt[k];save()},setOv=(k,c)=>{c?S.ov[k]=c:delete S.ov[k];save();$('#dg').close();draw()},setInc=(k,c)=>{c?S.inc[k]=c:delete S.inc[k];save();$('#dg').close();draw()};

async function pdf(m){if(!window.jspdf)await new Promise((ok,ko)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.onload=ok;s.onerror=()=>{alert('No se pudo cargar el generador de PDF (¿sin conexión?)');ko()};document.head.appendChild(s)});
let logo=null;try{logo=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=96;c.getContext('2d').drawImage(i,0,0,96,96);ok(c.toDataURL('image/jpeg'))};i.onerror=ko;i.src='icon-192.png'})}catch(e){}
